# seqflow rule file
# All schema knowledge lives here. The parser is generic and reads this to
# decide what is a container, what to skip, what shape a node gets, and which
# attributes create non-sequential edges.
#
# Adding support for a new step type means editing this file, not the parser.

version: 1

# Elements that hold other steps. Their children are ordered and executed
# in document order.
containers:
  - TestSequence
  - Sequence
  - Loop

# Elements that are not steps and produce no node. Their content may still be
# surfaced in the inspector (see `inspector_children`).
ignore:
  - Variables
  - Parameters
  - Parameter
  - Timers
  - StatisticsCalculators
  - SubSequences
  - Comparison
  - DynamicName
  - Text
  # A prompt's message body. Its <Text> child is lifted into the inspector by
  # `inspector_children` below, so nothing is lost by not making it a node.
  - Message
  # Plant data that rides along in the same file and is not part of the flow.
  - TemperatureProfile
  - Point

# Recognised leaf step elements. Anything in step position that is not listed
# here still renders, as a plain rectangle, and raises an UNKNOWN_ELEMENT
# warning — it is never silently dropped. See spec section 3 and NFR-6.
#
# Adding support for a new step type starts here.
steps:
  - SetSwitchState
  - WaitStep
  - TestCriteriaEvaluation
  - SetStatus
  - ConditionStep
  - SetSetpoint
  - StartPeriodicLog
  - SetEnum
  - StopPeriodicLog
  - GoTo
  - PlayStatusTone
  - StartLogging
  - StopLogging
  - SelectOption
  - RecordData
  - UserInputBoolean
  - ClearBaseline
  - AcceptCalibration
  - AcceptBaseline

# Non-step children whose attributes are merged into the parent node's
# inspector view. Comparison holds the actual condition for a ConditionStep.
inspector_children:
  ConditionStep: [Comparison]
  # The prompt shown to the operator. Nested two deep — <Message><Text/> — which
  # is why the lookup searches descendants rather than direct children.
  UserInputBoolean: [Text]

# Presentation-only grouping of element types, for the UI's Step Types filter
# panel. Changes no graph semantics — purely how the type list is organised
# on screen. An element not listed anywhere below falls under "Other" in the
# UI rather than disappearing (invariant 7).
categories:
  General:
    - Sequence
    - Loop
    - GoTo
    - SetStatus
  Control:
    - SetSwitchState
    - SetSetpoint
    - SetEnum
  Timing:
    - WaitStep
    - StartPeriodicLog
    - StopPeriodicLog
  Conditional:
    - ConditionStep
    - UserInputBoolean
    - TestCriteriaEvaluation
  Data Logging:
    - StartLogging
    - StopLogging
    - RecordData
  User Interaction:
    - SelectOption
    - PlayStatusTone
  Calibration:
    - ClearBaseline
    - AcceptCalibration
    - AcceptBaseline

# Node shape by element type.
shapes:
  ConditionStep:          diamond
  TestCriteriaEvaluation: hexagon
  UserInputBoolean:       diamond
  GoTo:                   rounded
  default:                rect

# Semantic category, used for styling and filtering.
kinds:
  ConditionStep:          decision
  TestCriteriaEvaluation: criteria
  UserInputBoolean:       decision
  GoTo:                   jump
  default:                action

# Attribute pairs that create a non-sequential edge.
#
# `when` gates the edge on another attribute's value. This is essential: the
# target attributes below are populated even when the paired action is
# "Continue", in which case they hold stale values that must be ignored.
# See spec section 4.2.
#
# A step emits a fall-through edge unless every one of its exits is an
# explicit jump.
edges:
  - when:   {failAction: "Go To Step"}
    target: failStep
    label:  fail
    style:  dotted
    reason: criteria

  - when:   {passAction: "Go To Step"}
    target: passStep
    label:  pass
    style:  solid
    reason: criteria

  - when:   {trueAction: "Go To Step"}
    target: trueStep
    label:  "true"
    style:  solid
    reason: branch

  - when:   {falseAction: "Go To Step"}
    target: falseStep
    label:  "false"
    style:  solid
    reason: branch

  # GoTo is unconditional — no `when` clause.
  - when:   {}
    target: stepUID
    label:  null
    style:  solid
    reason: goto

# Attributes appended to the node label at verbosity=params.
# Keep these short; long labels degrade auto-layout quality.
labels:
  SetSetpoint:      [setpointTag, setpoint]
  SetSwitchState:   [switchTag, state]
  SetEnum:          [enumTag, enumValue]
  SetStatus:        [status]
  WaitStep:         [time]
  StartPeriodicLog: [loggedGroupName, interval_s]
  StopPeriodicLog:  [groupName]
  SelectOption:     [optionTag]
  RecordData:       [type, durationSec]

# Attributes holding references to definitions outside this file. Unresolvable
# by design — do not emit an unresolved-target warning for these.
external_refs:
  - criteriaMap

# Containers that repeat. The back edge runs from the container's last leaf to
# its first, labelled with `count`, and carries `reason: loop`.
loops:
  Loop:
    count:  iterations

# Render a target once as a shared terminal, with dotted inbound edges, when
# more than this many edges converge on it. See spec section 4.5.
convergence_threshold: 3

# Whether a leaf node's canvas box shows its `labels` text (the
# "setpointTag = ..." line). Optional; absent means true. Off here — that
# line reads as internal metadata, not something a reader following the flow
# needs printed on the shape itself.
show_params_on_canvas: false
